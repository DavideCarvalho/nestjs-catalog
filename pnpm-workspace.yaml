packages:
  - "packages/*"

overrides:
  # @dudousxd/nestjs-telescope (a devDependency here) pins better-sqlite3 11.10.0, which does not
  # compile on Node 26 and has no prebuild for it. 12.11.1 ships one. Dev-only: consumers resolve
  # telescope's own dependency.
  better-sqlite3: 12.11.1

allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': true
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  ssh2: false

minimumReleaseAgeExclude:
  # First-party packages: the minimum-release-age policy guards against recently-published
  # THIRD-party (potentially compromised) deps — our own scope is exempt. Patterns match
  # package NAMES (globs), not name@version.
  - '@dudousxd/*'
  - '@tanstack/react-table@9.0.0'
  - '@tanstack/table-core@9.0.0'
  - '@pierre/diffs@1.3.3'
  - hyparquet@1.28.1
