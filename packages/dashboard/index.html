<!doctype html>
<!-- `class="dark"` is not a preference here, it is the console's identity: the
     four Aviary consoles are one dark surface distinguished by an accent, and a
     light catalog beside a dark durable would read as a different product.
     Forced rather than left to `prefers-color-scheme`, which would make the set
     inconsistent on any machine set to light. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No web fonts from another origin. The page loads nothing but its own
         files, so a host with a strict Content-Security-Policy, or an air-gapped
         deployment, serves it as is. `styles.css` names the fonts and falls back
         to the system's. -->
    <title>catalog · console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
