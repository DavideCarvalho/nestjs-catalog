<!doctype html>
<!-- `class="dark"` is not a preference here, it is the console's identity: the
     four Aviary consoles are one dark surface distinguished by an accent, and a
     light catalog beside a dark durable would read as a different product.
     Forced rather than left to `prefers-color-scheme`, which would make the set
     inconsistent on any machine set to light. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>catalog · console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
