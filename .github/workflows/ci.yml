name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # The third gate, and the reason the other two were not enough.
      #
      # `build` compiles each package's `src` through its own tsconfig, and every one of those
      # configs EXCLUDES the specs on purpose — a spec compiled into `dist/` would be published. So
      # until this step existed, no job in this repo typechecked a single spec file, and `vitest`
      # does not either: SWC strips the types and never asks whether they were right. Several specs
      # had been quietly wrong for an unknown number of releases behind a green suite.
      #
      # Runs after `build` rather than replacing it: `pnpm typecheck` covers the configs `build`
      # cannot (the dashboard's server tsconfig, which vite and tsup never typecheck) plus every
      # `packages/*/tsconfig.spec.json`. It costs about ten seconds — the spec configs resolve
      # workspace packages to source, so it needs no build of its own and the eight `tsc` runs go
      # in parallel. That is cheap enough that gating on it rather than merely reporting is easy:
      # a red typecheck here is a spec that has drifted from the code it claims to test, and the
      # whole lesson of this file is what happens when that is allowed to be somebody's later.
      - run: pnpm typecheck

  test-db:
    name: Store contract (real engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `test/catalog-store-contract.ts` is the definition of done for a store adapter: an
      # adapter either passes the same cases the shipped ones pass, or the reason it cannot is
      # stated out loud as a skip. Until this job existed that suite only ran locally, so the
      # promise was never actually enforced — a PR could merge an adapter that had quietly
      # stopped passing it. Docker is present on the GitHub-hosted runner, so the testcontainers
      # engines this suite spins up need no extra setup here.
      - run: pnpm test:db
