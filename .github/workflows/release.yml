name: Release

#   push to main -> version the pending changesets in place (a "chore: version packages"
#                   commit pushed to main) and publish them, in the same run
#   run manually -> throwaway beta snapshot, changesets and git untouched
#
# No "Version Packages" PR to merge: merging a PR that carries a changeset IS the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases concurrently (avoids a double-publish race).
concurrency: release-${{ github.ref }}

jobs:
  # Gate: the same jobs as ci.yml, run on the exact commit being released -- a published
  # version is effectively unrecallable, so the PR's CI on an older base is not enough. The
  # version/publish job below needs all of them.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # The third gate, and the reason the other two were not enough.
      #
      # `build` compiles each package's `src` through its own tsconfig, and every one of those
      # configs EXCLUDES the specs on purpose — a spec compiled into `dist/` would be published. So
      # until this step existed, no job in this repo typechecked a single spec file, and `vitest`
      # does not either: SWC strips the types and never asks whether they were right. Several specs
      # had been quietly wrong for an unknown number of releases behind a green suite.
      #
      # Runs after `build` rather than replacing it: `pnpm typecheck` covers the configs `build`
      # cannot (the dashboard's server tsconfig, which vite and tsup never typecheck) plus every
      # `packages/*/tsconfig.spec.json`. It costs about ten seconds — the spec configs resolve
      # workspace packages to source, so it needs no build of its own and the eight `tsc` runs go
      # in parallel. That is cheap enough that gating on it rather than merely reporting is easy:
      # a red typecheck here is a spec that has drifted from the code it claims to test, and the
      # whole lesson of this file is what happens when that is allowed to be somebody's later.
      - run: pnpm typecheck

      # The fourth gate, and the step the three above were standing in for.
      #
      # `typecheck` above proves the specs COMPILE. It says nothing about whether they pass,
      # and until this step existed nothing in this repo ran them: 3,552 unit tests across 233
      # files, none of them gating a merge, while `test-db` gated the store contract alone. A
      # spec could be correct, compile, and assert something nobody had checked since it was
      # written.
      #
      # Turning it on required fixing what it found first, which is why it arrives after the
      # others rather than with them: `catalog.export.integration.spec.ts` read a streaming
      # pipeline's parked row count after a fixed sleep and bounded it at a number that is a
      # property of the machine's socket buffers rather than of the code, so it failed roughly
      # one run in four on a pipeline that was working.
      - run: pnpm test

  test-db:
    name: Store contract (real engines)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `test/catalog-store-contract.ts` is the definition of done for a store adapter: an
      # adapter either passes the same cases the shipped ones pass, or the reason it cannot is
      # stated out loud as a skip. Until this job existed that suite only ran locally, so the
      # promise was never actually enforced — a PR could merge an adapter that had quietly
      # stopped passing it. Docker is present on the GitHub-hosted runner, so the testcontainers
      # engines this suite spins up need no extra setup here.
      - run: pnpm test:db

  release:
    if: github.event_name == 'push'
    name: Version and Publish
    needs: [build, test-db]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "chore: version packages" commit + git tags
      id-token: write # npm provenance (OIDC), harmless if unused
      pull-requests: read # @changesets/changelog-github resolves each changeset's PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          # pnpm 11.5 (the pinned packageManager) needs Node >= 22.13; .nvmrc pins it.
          node-version-file: .nvmrc
          cache: pnpm
          # Writes ~/.npmrc pointing at npm and reading NODE_AUTH_TOKEN, so
          # `changeset publish` authenticates without a committed token.
          registry-url: "https://registry.npmjs.org"

      # This repo publishes with npm trusted publishing (OIDC) rather than a
      # long-lived NPM_TOKEN: the `id-token: write` permission above lets the job
      # mint a short-lived credential, and each package names this repo +
      # workflow as its trusted publisher on npmjs.com.
      #
      # npm only learned OIDC in 11.5.1, and .nvmrc pins Node 22, which ships
      # 10.9.x. Without this step the publish fails as
      # `E404 - PUT https://registry.npmjs.org/<pkg>` — npm answers 404 rather
      # than 403 for an unauthorized package, so it reads as "no such package"
      # rather than "not authenticated", which is a long way from the cause.
      # Upgraded here rather than by moving .nvmrc to Node 24, so the toolchain
      # stays identical to the rest of Aviary and only the publish step differs.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the new dependency would reach npm only with the next hand-written changeset. This writes
      # a patch changeset for it, which the version step below then releases like any other.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.event_name == 'push' && github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/renovate-release.mjs" <<'NODE'
          // Writes a patch changeset for a Renovate dependency bump, and only for one: it stays quiet
          // unless a published package's dependencies or peerDependencies actually moved, so lockfile
          // maintenance, devDependency bumps and Actions bumps do not each cut a release.
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, writeFileSync } from "node:fs";

          const before = process.env.BEFORE;
          const after = process.env.AFTER || "HEAD";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });
          const skip = (why) => {
            console.log("No dependency release: " + why);
            process.exit(0);
          };

          // A changeset already waiting means a hand-written release is queued behind it. Versioning now
          // would drag that unreleased work out under a dependency bump's name.
          const pending = existsSync(".changeset")
            ? readdirSync(".changeset").filter((f) => f.endsWith(".md") && f.toLowerCase() !== "readme.md")
            : [];
          if (pending.length > 0) skip("changeset(s) already pending (" + pending.join(", ") + ")");
          if (!before || /^0+$/.test(before)) skip("no previous commit to compare against");

          const changed = git("diff", "--name-only", before + ".." + after)
            .split("\n")
            .filter((f) => f === "package.json" || f.endsWith("/package.json"));
          if (changed.length === 0) skip("no package.json changed");

          const readAt = (rev, path) => {
            try {
              return JSON.parse(git("show", rev + ":" + path));
            } catch {
              return null;
            }
          };

          const bumped = [];
          for (const path of changed) {
            const now = readAt(after, path);
            if (!now || !now.name || now.private === true) continue;
            const then = readAt(before, path) || {};
            const moved = ["dependencies", "peerDependencies"].some(
              (field) => JSON.stringify(now[field] || {}) !== JSON.stringify(then[field] || {}),
            );
            if (moved) bumped.push(now.name);
          }
          if (bumped.length === 0) skip("no published package changed a runtime dependency");

          const summary = git("log", "-1", "--pretty=%s", after).trim();
          writeFileSync(
            ".changeset/renovate-" + after.slice(0, 12) + ".md",
            ["---", ...bumped.map((name) => '"' + name + '": patch'), "---", "", summary, ""].join("\n"),
          );
          console.log("Patch release queued for " + bumped.join(", "));
          NODE
          node "$RUNNER_TEMP/renovate-release.mjs"

      # Pending changesets -> bump versions and changelogs and push them as a "chore: version
      # packages" commit to the branch (a GITHUB_TOKEN push starts no new run, so this cannot loop).
      #
      # Only what the gate tested is released. If the branch moved during this run, the only commits
      # tolerated on top of the tested one are this bot's own version commits (same code, only
      # versions and changelogs moved): fast-forward onto them so their changesets are not versioned
      # twice. Any other commit is untested here, so stop cleanly -- no version, no publish -- and let
      # the run queued for it (concurrency group) gate and release the combined tree.
      - name: Version packages
        id: version
        env:
          TESTED: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          # @changesets/changelog-github looks up each changeset's PR and author; throws without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          superseded() {
            echo "::notice::branch moved past the tested commit; the newer run will release"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          moved=$(git rev-list "$TESTED..origin/$BRANCH")
          for c in $moved; do
            [ "$(git log -1 --format='%an|%s' "$c")" = 'github-actions[bot]|chore: version packages' ] || superseded
          done
          git merge --ff-only "origin/$BRANCH"
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'readme.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets: publishing whatever is not on npm yet."
            exit 0
          fi
          pnpm version-packages
          git add -A
          if git diff --cached --quiet; then
            echo "version-packages changed nothing (e.g. only private packages): nothing to commit."
            exit 0
          fi
          git commit -m "chore: version packages"
          git push origin "HEAD:$BRANCH" && exit 0
          # Rejected: the branch moved after the check above. Fail loudly only if it did not move.
          git fetch origin "$BRANCH"
          [ "$(git rev-parse "origin/$BRANCH")" != "$(git rev-parse HEAD~1)" ] && superseded
          echo "::error::Pushing the version commit failed and the branch has not moved."
          exit 1

      # No changesets are left by now, so the action takes its publish path: `pnpm release` (build
      # + `changeset publish`) publishes every package whose version is not on npm yet, then tags
      # git and creates the GitHub releases.
      - name: Publish to npm
        if: steps.version.outputs.superseded != 'true'
        uses: changesets/action@v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately no NODE_AUTH_TOKEN. `setup-node` writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc,
          # so passing an unset secret leaves an EMPTY credential there, and npm
          # sends that instead of falling through to the OIDC exchange. Absent
          # is not the same as empty. Add it back only if this repo ever moves
          # off trusted publishing and onto a long-lived token.
          NPM_CONFIG_PROVENANCE: true

  snapshot:
    name: Publish beta snapshot to npm
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test-db]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC credential npm exchanges for a publish token
      pull-requests: read # @changesets/changelog-github, as in the release job
    steps:
      # Cuts a THROWAWAY prerelease of every package with a pending changeset, published under the
      # `beta` dist-tag as `0.0.0-beta-<timestamp>`. It does NOT consume the changesets, bump source
      # versions, or tag git, so the eventual real release (the next push to main) is untouched
      # and still produces clean semver.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          # pnpm 11.5 (the pinned packageManager) needs Node >= 22.13; .nvmrc pins it.
          node-version-file: .nvmrc
          cache: pnpm
          # Writes ~/.npmrc pointing at npm and reading NODE_AUTH_TOKEN, so
          # `changeset publish` authenticates without a committed token.
          registry-url: "https://registry.npmjs.org"

      # This repo publishes with npm trusted publishing (OIDC) rather than a
      # long-lived NPM_TOKEN: the `id-token: write` permission above lets the job
      # mint a short-lived credential, and each package names this repo +
      # workflow as its trusted publisher on npmjs.com.
      #
      # npm only learned OIDC in 11.5.1, and .nvmrc pins Node 22, which ships
      # 10.9.x. Without this step the publish fails as
      # `E404 - PUT https://registry.npmjs.org/<pkg>` — npm answers 404 rather
      # than 403 for an unauthorized package, so it reads as "no such package"
      # rather than "not authenticated", which is a long way from the cause.
      # Upgraded here rather than by moving .nvmrc to Node 24, so the toolchain
      # stays identical to the rest of Aviary and only the publish step differs.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp every pending-changeset package (and any out-of-range dependent) to
      # `0.0.0-beta-<datetime>` in the runner only, never committed.
      - name: Version as beta snapshot
        run: pnpm changeset version --snapshot beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: pnpm exec turbo run build

      # `@latest` is untouched: these land under the `beta` dist-tag with no git tag.
      - name: Publish beta snapshot
        run: pnpm changeset publish --tag beta --no-git-tag
        env:
          # No NODE_AUTH_TOKEN here either: publish auth is OIDC trusted publishing.
          NPM_CONFIG_PROVENANCE: true
